<!--* The borders to collapse into one border.
* th, td padding 5px.
* Text aligns to left.-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <title></title>
    <meta charset="utf-8">
    
<style>
    table,th,td{
        padding: 5px;
        border: 1px solid black;
        border-collapse: collapse;
        text-align: left;
    }
    .c1{
        color:blue;
    }
    .c2{
        color:red;
    }
    .font_box{
        width: 100ch;
    }
</style>
  
</head>
<body>
    <table >
        <tr>
            <th>Name</th>
            <th>Student Id</th>
        </tr>
        <tr>
            <td>陳政煒</td>
            <td>113403545</td>
        </tr>
    </table>
</body>
